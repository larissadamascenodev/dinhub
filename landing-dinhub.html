<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DinHub | Inteligência Financeira Brasileira</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg: #0a0a0a;
            --primary: #00e676;
            --glow: #00ff88;
            --text: #ffffff;
            --text-sec: #a0a0a0;
            --card: #0f0f0f;
            --border: #1a1a1a;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; overflow-x: hidden; }
        h1, h2, h3 { font-family: 'Sora', sans-serif; }
        .pill { border-radius: 999px; }
        /* Add more CSS here as needed... */
    </style>
</head>
<body>
    <nav style="position: sticky; top: 16px; z-index: 100; margin: 0 auto; width: fit-content; background: rgba(10,10,10,0.85); backdrop-filter: blur(10px); border: 1px solid var(--border); padding: 10px 10px 10px 20px; display: flex; gap: 20px; align-items: center;" class="pill">
        <div style="font-family: 'Sora', sans-serif; font-weight: 800; font-size: 1.2rem;">
            <span style="color: white">Din</span><span style="color: var(--primary)">Hub</span>
        </div>
        <button style="background: var(--primary); color: black; border: none; padding: 8px 16px;" class="pill">Começar grátis</button>
    </nav>
    <main>
        <section style="padding: 100px 20px; text-align: center;">
            <h1 style="font-size: clamp(2.4rem, 6vw, 5rem); margin-bottom: 20px;">
                Seu dinheiro some todo mês<br>
                <span style="color: var(--primary)">e você não sabe por quê.</span>
            </h1>
            <p style="color: var(--text-sec); font-size: 1.2rem; max-width: 600px; margin: 0 auto 30px;">
                O DinHub encontra para onde seu dinheiro vai, te avisa antes de estourar o limite e te mostra exatamente o que cortar.
            </p>
        </section>
    </main>
    <script>
        // JS here...
    </script>
</body>
</html>
